s:none}

<script>
const QUIZ = {
 "title": "Chapter 4 Practice: Indices and Surds",
 "subtitle": "Active Maths 3, Chapter 4, pages 65 to 75",
 "intro": "35 questions based on the exercises in Chapter 4, across 5 sections. Do them all, or pick the sections you’re working on.",
 "questions": [
  {
   "topic": "4.1 Numbers in Index Form",
   "q": "A number in index form is written aⁿ. What is a called?",
   "options": [
    "The base",
    "The index",
    "The power",
    "The exponent"
   ],
   "answer": 0,
   "hint": "It is the number being multiplied by itself.",
   "why": "In aⁿ, a is the base and n is the index (also called the power or exponent)."
  },
  {
   "topic": "4.1 Numbers in Index Form",
   "q": "Write 2 × 2 × 2 × 2 × 2 × 2 in index form.",
   "options": [
    "2⁶",
    "6²",
    "2 × 6",
    "12"
   ],
   "answer": 0,
   "hint": "How many 2s are multiplied together?",
   "why": "Six 2s multiplied together is 2⁶."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "Simplify 3⁴ × 3⁶, giving your answer in index form.",
   "options": [
    "3¹⁰",
    "3²⁴",
    "9¹⁰",
    "3²"
   ],
   "answer": 0,
   "hint": "Law 1: when you multiply, do you add or multiply the indices?",
   "why": "a^p × a^q = a^(p + q), so 3⁴ × 3⁶ = 3¹⁰."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "Simplify 5⁸ ÷ 5³, giving your answer in index form.",
   "options": [
    "5⁵",
    "5¹¹",
    "1⁵",
    "5^(8/3)"
   ],
   "answer": 0,
   "hint": "Law 2: dividing means subtract the indices.",
   "why": "5⁸ ÷ 5³ = 5^(8 − 3) = 5⁵."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "Simplify (2²)⁵, giving your answer in index form.",
   "options": [
    "2¹⁰",
    "2⁷",
    "4⁵",
    "2²⁵"
   ],
   "answer": 0,
   "hint": "Law 3: a power of a power. Multiply or add the indices?",
   "why": "(a^p)^q = a^(pq), so (2²)⁵ = 2¹⁰."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "What is 7⁰?",
   "options": [
    "1",
    "0",
    "7",
    "70"
   ],
   "answer": 0,
   "hint": "Law 4: any non-zero number to the power of zero.",
   "why": "a⁰ = 1 for any a ≠ 0, so 7⁰ = 1."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "Evaluate (−2)⁴.",
   "options": [
    "16",
    "−16",
    "−8",
    "8"
   ],
   "answer": 0,
   "hint": "A negative number to an even power is…?",
   "why": "(−2)(−2)(−2)(−2) = 16. An even power of a negative gives a positive answer."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "Evaluate (−3)³.",
   "options": [
    "−27",
    "27",
    "−9",
    "9"
   ],
   "answer": 0,
   "hint": "A negative number to an odd power is…?",
   "why": "(−3)(−3)(−3) = −27. An odd power of a negative number gives a negative answer."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "What is the difference between (−7)² and −7²?",
   "options": [
    "(−7)² = 49 but −7² = −49",
    "They are both 49",
    "They are both −49",
    "(−7)² = −49 but −7² = 49"
   ],
   "answer": 0,
   "hint": "In −7², only the 7 is squared.",
   "why": "(−7)² = (−7)(−7) = 49, while −7² = −(7)(7) = −49. That’s why brackets matter."
  },
  {
   "topic": "4.2 Laws 1–4 of Indices",
   "q": "Simplify (3⁴)⁵ ÷ 3⁶, giving your answer in index form.",
   "options": [
    "3¹⁴",
    "3³",
    "3²⁶",
    "3⁹"
   ],
   "answer": 0,
   "hint": "Law 3 first (multiply the indices), then Law 2.",
   "why": "(3⁴)⁵ = 3²⁰, then 3²⁰ ÷ 3⁶ = 3¹⁴."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Write 5⁻³ without using indices.",
   "options": [
    "1/125",
    "−125",
    "−15",
    "1/15"
   ],
   "answer": 0,
   "hint": "Law 7: a negative index means ‘1 over’.",
   "why": "5⁻³ = 1/5³ = 1/125. A negative index never makes the answer negative."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Evaluate 25^(1/2).",
   "options": [
    "5",
    "12.5",
    "625",
    "1/25"
   ],
   "answer": 0,
   "hint": "Law 5: a power of 1/2 means the square root.",
   "why": "25^(1/2) = √25 = 5."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Evaluate ∛1,000.",
   "options": [
    "10",
    "100",
    "333.3",
    "30"
   ],
   "answer": 0,
   "hint": "Which number times itself three times gives 1,000?",
   "why": "10 × 10 × 10 = 1,000, so ∛1,000 = 1,000^(1/3) = 10."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Write 4^(3/2) without using indices.",
   "options": [
    "8",
    "6",
    "64",
    "2"
   ],
   "answer": 0,
   "hint": "Law 6: the bottom of the fraction is the root, the top is the power. Do the root first.",
   "why": "4^(3/2) = (√4)³ = 2³ = 8."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Evaluate 32^(4/5).",
   "options": [
    "16",
    "25.6",
    "8",
    "1,024"
   ],
   "answer": 0,
   "hint": "Fifth root of 32 first, then raise to the power of 4.",
   "why": "(⁵√32)⁴ = 2⁴ = 16."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Evaluate 64^(−4/3).",
   "options": [
    "1/256",
    "−256",
    "1/16",
    "−1/256"
   ],
   "answer": 0,
   "hint": "Deal with the minus first (‘1 over’), then cube root, then power of 4.",
   "why": "64^(−4/3) = 1/64^(4/3) = 1/(∛64)⁴ = 1/4⁴ = 1/256."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Write √8 as a power of 2.",
   "options": [
    "2^(3/2)",
    "2³",
    "2^(1/2)",
    "2⁴"
   ],
   "answer": 0,
   "hint": "8 = 2³, and a square root means a power of 1/2.",
   "why": "√8 = (2³)^(1/2) = 2^(3/2)."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Given that (√8)⁶/8⁵ = 8ᵗ, find t.",
   "options": [
    "t = −2",
    "t = 2",
    "t = −4",
    "t = 1"
   ],
   "answer": 0,
   "hint": "(√8)⁶ = (8^(1/2))⁶ = 8³. Then use Law 2.",
   "why": "8³ ÷ 8⁵ = 8^(3 − 5) = 8⁻², so t = −2."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Evaluate (27/1,000)^(2/3).",
   "options": [
    "9/100",
    "3/10",
    "18/300",
    "27/100"
   ],
   "answer": 0,
   "hint": "Law 9: apply the power to the top and the bottom. Cube root first, then square.",
   "why": "∛27 = 3 and ∛1,000 = 10, so (3/10)² = 9/100."
  },
  {
   "topic": "4.3 Laws 5–9 of Indices",
   "q": "Write 2^(−5) in the form 1/aⁿ.",
   "options": [
    "1/2⁵",
    "−2⁵",
    "1/2^(−5)",
    "−1/2⁵"
   ],
   "answer": 0,
   "hint": "Law 7: a^(−p) = 1/a^p.",
   "why": "2^(−5) = 1/2⁵. A negative index means ‘one over’."
  },
  {
   "topic": "4.4 Equations with x as an Index",
   "q": "Solve 2ˣ = 16.",
   "options": [
    "x = 4",
    "x = 8",
    "x = 3",
    "x = 14"
   ],
   "answer": 0,
   "hint": "Write 16 as a power of 2.",
   "why": "16 = 2⁴, so 2ˣ = 2⁴ and x = 4."
  },
  {
   "topic": "4.4 Equations with x as an Index",
   "q": "Solve 3^(x − 2) = 27.",
   "options": [
    "x = 5",
    "x = 3",
    "x = 1",
    "x = 29"
   ],
   "answer": 0,
   "hint": "Write 27 as a power of 3, then make the indices equal.",
   "why": "27 = 3³, so x − 2 = 3 and x = 5."
  },

function fmt(raw){
  const S1="\u0001",S2="\u0002",S3="\u0003",P1="\u0004",P2="\u0005";
  let s=String(raw).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s=s.replace(/\bm\/s\b/g,"m∕s").replace(/AND\/OR/g,"AND∕OR");
  const RUN=/[A-Za-z0-9√π.,²³⁴⁵⁶⁷⁸⁹⁰¹ˣᵗⁿ⁻∛]/;
  const OPEN={"(":")","[":"]"}, CLOSE={")":"(","]":"["};
  function fwdGroup(t,i){let d=0;for(let k=i;k<t.length;k++){if(OPEN[t[k]])d++;else if(CLOSE[t[k]]){d--;if(!d)return k;}}return -1;}
  function backGroup(t,i){let d=0;for(let k=i;k>=0;k--){if(CLOSE[t[k]])d++;else if(OPEN[t[k]]){d--;if(!d)return k;}}return -1;}
  // powers: ^(group) or ^token
  let out="";
  for(let i=0;i<s.length;i++){
    if(s[i]==="^"){
      if(s[i+1]==="("){const e=fwdGroup(s,i+1);if(e>0){out+=P1+s.slice(i+2,e)+P2;i=e;continue;}}
      let j=i+1;while(j<s.length&&/[A-Za-z0-9−]/.test(s[j]))j++;
      if(j>i+1){out+=P1+s.slice(i+1,j)+P2;i=j-1;continue;}
    }
    out+=s[i];
  }
  s=out;
  function strip(t){if(OPEN[t[0]]&&fwdGroup(t,0)===t.length-1)return t.slice(1,-1);return t;}
  // fractions
  for(let guard=0;guard<50;guard++){
    let idx=-1;
    for(let i=0;i<s.length;i++){if(s[i]==="/"){idx=i;break;}}
    if(idx<0)break;
    // numerator
    let a=idx-1;
    while(a>=0&&/[²³⁴⁵⁶⁷⁸⁹⁰¹]/.test(s[a]))a--;
    if(a>=0&&s[a]===P2){a=s.lastIndexOf(P1,a)-1;}
    if(a>=0&&CLOSE[s[a]]){a=backGroup(s,a)-1;}
    while(a>=0&&RUN.test(s[a]))a--;
    a++;
    // denominator
    let b=idx+1;
    if(s[b]==="√"&&OPEN[s[b+1]])b++;
    if(OPEN[s[b]]){const e=fwdGroup(s,b);b=e>0?e+1:b;}
    else{while(b<s.length&&RUN.test(s[b]))b++;while(b>idx+1&&/[.,]/.test(s[b-1]))b--;}
    while(b<s.length&&/[²³⁴⁵⁶⁷⁸⁹⁰¹]/.test(s[b]))b++;
    if(s[b]===P1){b=s.indexOf(P2,b)+1;}
    const num=s.slice(a,idx),den=s.slice(idx+1,b);
    if(!num||!den||a<0){s=s.slice(0,idx)+"∕"+s.slice(idx+1);continue;}
    s=s.slice(0,a)+S1+strip(num)+S2+strip(den)+S3+s.slice(b);
  }
  return s.replace(/∕/g,"/").split(S1).join('<span class="fr"><span>').split(S2).join('</span><span>').split(S3).join('</span></span>')
          .split(P1).join("<sup>").split(P2).join("</sup>");
}
const $ = id => document.getElementById(id);
const LETTERS = ["A","B","C","D","E","F"];
let round = [], i = 0, score = 0, missed = [], answered = false;

function shuffle(arr){
  for(let k = arr.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [arr[k], arr[j]] = [arr[j], arr[k]];
  }
  return arr;
}
function show(id){
  ["startScreen","quizScreen","endScreen"].forEach(s => $(s).hidden = (s !== id));
  const inQuiz = id === "quizScreen";
  $("meta").hidden = !inQuiz;
  $("barWrap").hidden = !inQuiz;
}
function prepare(q){
  const opts = q.options.map((text, idx) => ({text, correct: idx === q.answer}));
  return Object.assign({}, q, {opts: q.keepOrder ? opts : shuffle(opts)});
}
function start(){
  round = shuffle(pool()).map(prepare);
  i = 0; score = 0; missed = [];
  show("quizScreen");
  render();
}
function render(){
  answered = false;
  const q = round[i];
  $("topic").innerHTML = fmt(q.topic || "Question");
  $("question").innerHTML = fmt(q.q);
  $("count").textContent = "Question " + (i + 1) + " of " + round.length;
  $("tally").textContent = "Score: " + score;
  $("bar").style.width = (i / round.length * 100) + "%";
  $("hint").innerHTML = fmt(q.hint || "");
  $("hint").hidden = true;
  $("hintBtn").hidden = !q.hint;
  const fb = $("feedback"); fb.className = "feedback"; fb.textContent = "";
  $("nextBtn").hidden = true;
  const box = $("options"); box.textContent = "";
  q.opts.forEach((o, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    const l = document.createElement("span"); l.className = "letter"; l.textContent = LETTERS[idx];
    const t = document.createElement("span"); t.innerHTML = fmt(o.text);
    b.appendChild(l); b.appendChild(t);
    b.addEventListener("click", () => choose(idx));
    box.appendChild(b);
  });
  window.scrollTo({top:0});
}
function choose(idx){
  if(answered) return;
  answered = true;
  const q = round[i];
  const buttons = Array.from($("options").children);
  const correct = q.opts[idx].correct;
  const rightText = q.opts.find(o => o.correct).text;
  buttons.forEach((b, k) => {
    b.disabled = true;
    if(q.opts[k].correct) b.classList.add("right");
    else if(k === idx) b.classList.add("wrong");
  });
  const fb = $("feedback");
  const head = document.createElement("b");
  const body = document.createElement("span");
  if(correct){ score++; fb.className = "feedback good"; head.textContent = "Correct!"; }
  else { missed.push({q: q.q, a: rightText, why: q.why}); fb.className = "feedback bad"; head.innerHTML = "Not quite. The answer is: " + fmt(rightText); }
  body.innerHTML = fmt(q.why || "");
  fb.appendChild(head); fb.appendChild(body);
  $("tally").textContent = "Score: " + score;
  $("bar").style.width = ((i + 1) / round.length * 100) + "%";
  $("hintBtn").hidden = true;
  const next = $("nextBtn");
  next.textContent = (i === round.length - 1) ? "See my score" : "Next question";
  next.hidden = false;
  next.focus();
}
function finish(){
  show("endScreen");
  const name = $("nameInput").value.trim();
  const d = new Date();
  const day = d.toLocaleDateString("en-IE", {day:"numeric", month:"long", year:"numeric"});
  const secs = chosen();
  $("who").textContent = (name ? name + " · " : "") + day + " · " + (secs.length === SECTIONS.length ? "All sections" : secs.join(", "));
  $("finalScore").textContent = score + " / " + round.length;
  const pct = score / round.length;
  $("finalMsg").textContent =
    pct === 1 ? "Perfect score. Take a bow." :
    pct >= 0.75 ? "Great work. You know this well." :
    pct >= 0.5 ? "Good effort. Check the ones below, then try again." :
    "Keep going. Read over the pages again, then try again.";
  const list = $("missedList"); list.textContent = "";
  missed.forEach(m => {
    const li = document.createElement("li");
    const s = document.createElement("strong"); s.innerHTML = fmt(m.q);
    const a = document.createElement("span"); a.innerHTML = fmt("Answer: " + m.a + (m.why ? ". " + m.why : ""));
    li.appendChild(s); li.appendChild(a); list.appendChild(li);
  });
  $("missedWrap").hidden = missed.length === 0;
  $("againBtn").focus();
}

$("title").textContent = QUIZ.title;
document.title = QUIZ.title;
$("subtitle").textContent = QUIZ.subtitle || "";
$("subtitle").hidden = !QUIZ.subtitle;
$("introText").textContent = QUIZ.intro;
const SECTIONS = [];
QUIZ.questions.forEach(q => { if(!SECTIONS.includes(q.topic)) SECTIONS.push(q.topic); });
const list = $("sectionList");
SECTIONS.forEach((s, k) => {
  const lab = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox"; box.checked = true; box.value = s; box.id = "sec" + k;
  box.addEventListener("change", updateCount);
  const txt = document.createElement("span"); txt.textContent = s;
  const n = QUIZ.questions.filter(q => q.topic === s).length;
  const sm = document.createElement("small"); sm.textContent = n + (n === 1 ? " question" : " questions");
  lab.appendChild(box); lab.appendChild(txt); lab.appendChild(sm);
  list.appendChild(lab);
});
function chosen(){ return Array.from(list.querySelectorAll("input:checked")).map(b => b.value); }
function pool(){ const c = chosen(); return QUIZ.questions.filter(q => c.includes(q.topic)); }
function updateCount(){
  const n = pool().length;
  $("pickCount").textContent = n ? n + " questions selected" : "No sections selected";
  if(n) $("pickError").hidden = true;
}
$("allBtn").addEventListener("click", () => { list.querySelectorAll("input").forEach(b => b.checked = true); updateCount(); });
$("noneBtn").addEventListener("click", () => { list.querySelectorAll("input").forEach(b => b.checked = false); updateCount(); });
updateCount();
function tryStart(){
  if(!pool().length){ $("pickError").hidden = false; return; }
  start();
}
$("startBtn").addEventListener("click", tryStart);
$("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") tryStart(); });
$("againBtn").addEventListener("click", start);
$("changeBtn").addEventListener("click", () => { show("startScreen"); window.scrollTo({top:0}); });
$("nextBtn").addEventListener("click", () => { i++; if(i < round.length) render(); else finish(); });
$("hintBtn").addEventListener("click", () => { $("hint").hidden = false; $("hintBtn").hidden = true; });
</script>
