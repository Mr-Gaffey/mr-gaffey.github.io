}
:root[data-theme="dark"]{

  --card:#222017; --line:#3a3726; --opt:#2a2719; --optLine:#4a4630; --optHover:#36321f;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend','Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.5}
header{background:var(--band);color:var(--bandInk);padding:20px 20px 18px}

.back{display:inline-block;margin-bottom:10px;color:var(--bandInk);font-size:16px;font-weight:500;text-decoration:none}

.pickCount{margin:10px 0 0;font-weight:500}

sup{font-size:.68em;line-height:0}sup .fr{vertical-align:.35em;font-size:.95em}sup .fr>span:first-child{border-bottom-width:1.5px}

<script>
const QUIZ = {
 "title": "Chapter 3 Practice: Algebra I",
 "subtitle": "Active Maths 3, Chapter 3, pages 44 to 64",
 "intro": "40 questions based on the exercises in Chapter 3, across 9 sections. Do them all, or pick the sections you’re working on.",
 "questions": [
  {
   "topic": "3.1 Expressions",
   "q": "Ivan is x years old. His son is half Ivan’s age. How old was his son three years ago?",
   "options": [
    "x/2 − 3",
    "(x − 3)/2",
    "x/2 + 3",
    "2x − 3"
   ],
   "answer": 0,
   "hint": "First write the son’s age now. Then go back three years.",
   "why": "The son is x/2 now, so three years ago he was x/2 − 3."
  },
  {
   "topic": "3.1 Expressions",
   "q": "How many months are there in n years and m months?",
   "options": [
    "12n + m",
    "12(n + m)",
    "n + 12m",
    "12nm"
   ],
   "answer": 0,
   "hint": "How many months are in one year? Only the years need to be changed into months.",
   "why": "Each year is 12 months, so n years is 12n months. Add the extra m months: 12n + m."
  },
  {
   "topic": "3.1 Expressions",
   "q": "A garden has a length of 10x m and a width of (4x − 1) m. Which expression gives its perimeter?",
   "options": [
    "28x − 2",
    "14x − 1",
    "40x² − 10x",
    "28x − 1"
   ],
   "answer": 0,
   "hint": "Perimeter means the distance all the way around. A rectangle has two lengths and two widths.",
   "why": "2(10x) + 2(4x − 1) = 20x + 8x − 2 = 28x − 2. 40x² − 10x is the area."
  },
  {
   "topic": "3.1 Expressions",
   "q": "q is an odd number. Which are the next three odd numbers?",
   "options": [
    "q + 2, q + 4, q + 6",
    "q + 1, q + 2, q + 3",
    "q + 1, q + 3, q + 5",
    "2q + 1, 2q + 3, 2q + 5"
   ],
   "answer": 0,
   "hint": "If q were 31, what would the next odd number be?",
   "why": "Odd numbers go up in steps of 2, so after q come q + 2, q + 4 and q + 6. q + 1 would be even."
  },
  {
   "topic": "3.2 Evaluating Expressions",
   "q": "If a = 2, b = 3 and c = −8, find the value of a² + ab + 2c.",
   "options": [
    "−6",
    "26",
    "6",
    "−26"
   ],
   "answer": 0,
   "hint": "Put each value in brackets. What is 2 × (−8)?",
   "why": "(2)² + (2)(3) + 2(−8) = 4 + 6 − 16 = −6."
  },
  {
   "topic": "3.2 Evaluating Expressions",
   "q": "If x = 3 and y = −1, find the value of 2x² − 2y³.",
   "options": [
    "20",
    "16",
    "38",
    "24"
   ],
   "answer": 0,
   "hint": "Do the powers first (BIMDAS). What is (−1)³?",
   "why": "2(3)² − 2(−1)³ = 2(9) − 2(−1) = 18 + 2 = 20. Remember 2x² means 2 × x², not (2x)²."
  },
  {
   "topic": "3.2 Evaluating Expressions",
   "q": "If p = −1, q = 2 and r = 5, evaluate 3(p − r)² − pq.",
   "options": [
    "110",
    "106",
    "326",
    "50"
   ],
   "answer": 0,
   "hint": "Work out the brackets first: −1 − 5 = ?",
   "why": "p − r = −6, so 3(−6)² = 3(36) = 108. Then − pq = −(−1)(2) = +2. 108 + 2 = 110."
  },
  {
   "topic": "3.2 Evaluating Expressions",
   "q": "The stopping distance of a car is d = v²/20. Find d when v = 20 m/s.",
   "options": [
    "20 m",
    "2 m",
    "40 m",
    "400 m"
   ],
   "answer": 0,
   "hint": "Square 20 first, then divide by 20.",
   "why": "d = (20)²/20 = 400/20 = 20 m."
  },
  {
   "topic": "3.3 Simplifying Expressions",
   "q": "Simplify 5a − 4b − 3 − a + 5b − 6.",
   "options": [
    "4a + b − 9",
    "6a + b − 9",
    "4a − 9b − 9",
    "4a + b + 3"
   ],
   "answer": 0,
   "hint": "Group the a terms, the b terms and the numbers. Watch the sign in front of each one.",
   "why": "5a − a = 4a, −4b + 5b = b, −3 − 6 = −9. So the answer is 4a + b − 9."
  },
  {
   "topic": "3.3 Simplifying Expressions",
   "q": "Simplify x² − 2x − 10 + 4 − 3x + 4x².",
   "options": [
    "5x² − 5x − 6",
    "4x² − 5x − 6",
    "5x² + x − 6",
    "5x² − 5x − 14"
   ],
   "answer": 0,
   "hint": "x² and x are not like terms. Keep them separate.",
   "why": "x² + 4x² = 5x², −2x − 3x = −5x, −10 + 4 = −6. So 5x² − 5x − 6."
  },
  {
   "topic": "3.3 Simplifying Expressions",
   "q": "Simplify −p² − 3p + 1 − 3p² − 2p − 4.",
   "options": [
    "−4p² − 5p − 3",
    "−2p² − 5p − 3",
    "−4p² − p − 3",
    "−4p² + 5p − 3"
   ],
   "answer": 0,
   "hint": "Collect the p² terms first. −1 lot of p² and −3 lots of p² makes…?",
   "why": "−p² − 3p² = −4p², −3p − 2p = −5p, 1 − 4 = −3."
  },
  {
   "topic": "3.3 Simplifying Expressions",
   "q": "Which pair are like terms?",
   "options": [
    "3x² and −7x²",
    "3x and 3x²",
    "2xy and 2x",
    "5x and 5y"
   ],
   "answer": 0,
   "hint": "Like terms have exactly the same letters raised to the same powers.",
   "why": "3x² and −7x² both have x². The number in front can be different, but the letters and powers must match."
  },
  {
   "topic": "3.4 Expanding Expressions",
   "q": "Expand and simplify 6(x + 1) + 2(x + 2).",
   "options": [
    "8x + 10",
    "8x + 3",
    "8x + 8",
    "12x + 10"
   ],
   "answer": 0,
   "hint": "Multiply every term inside each bracket by the number outside it.",
   "why": "6x + 6 + 2x + 4 = 8x + 10."
  },
  {
   "topic": "3.4 Expanding Expressions",
   "q": "Expand −3x(2x² − 3).",
   "options": [
    "−6x³ + 9x",
    "−6x³ − 9x",
    "−6x² + 9x",
    "−6x³ + 3x"
   ],
   "answer": 0,
   "hint": "What is x × x²? And what is (−3x) × (−3)?",
   "why": "−3x × 2x² = −6x³ and −3x × −3 = +9x. A minus times a minus gives a plus."
  },
  {
   "topic": "3.4 Expanding Expressions",
   "q": "Expand and simplify 2y(y + 2) − 5y(y − 1) − 3y.",
   "options": [
    "−3y² + 6y",
    "−3y² − 4y",
    "7y² − 4y",
    "−3y² + 12y"
   ],
   "answer": 0,
   "hint": "Be careful with −5y × −1.",
   "why": "2y² + 4y − 5y² + 5y − 3y = −3y² + 6y."
  },
  {
   "topic": "3.4 Expanding Expressions",
   "q": "Remove the brackets and simplify (x + 2)(x − 3).",
   "options": [
    "x² − x − 6",
    "x² + x − 6",
    "x² − 6",
    "x² − x + 6"
   ],
   "answer": 0,
   "hint": "Multiply each term in the first bracket by the whole second bracket.",
   "why": "x(x − 3) + 2(x − 3) = x² − 3x + 2x − 6 = x² − x − 6."
  },
  {
   "topic": "3.4 Expanding Expressions",
   "q": "Expand (5b − 2)².",
   "options": [
    "25b² − 20b + 4",
    "25b² + 4",
    "25b² − 10b + 4",
    "10b² − 20b + 4"
   ],
   "answer": 0,
   "hint": "(5b − 2)² means (5b − 2)(5b − 2). Don’t just square each term.",
   "why": "5b(5b − 2) − 2(5b − 2) = 25b² − 10b − 10b + 4 = 25b² − 20b + 4."
  },
  {
   "topic": "3.5 Factorising Expressions",
   "q": "Factorise fully 4a² − 6a.",
   "options": [
    "2a(2a − 3)",
    "2(2a² − 3a)",
    "a(4a − 6)",
    "2a(2a − 6)"
   ],
   "answer": 0,
   "hint": "What is the highest common factor of 4a² and 6a? It has a number and a letter.",
   "why": "The HCF is 2a. 4a² ÷ 2a = 2a and 6a ÷ 2a = 3, giving 2a(2a − 3). The other two take out only part of the HCF."
  },
  {
   "topic": "3.5 Factorising Expressions",
   "q": "Factorise 4x² − 81.",
   "options": [
    "(2x − 9)(2x + 9)",
    "(4x − 9)(4x + 9)",
    "(2x − 9)²",
    "(x − 9)(4x + 9)"
   ],
   "answer": 0,
   "hint": "This is a difference of two squares. What squared gives 4x²?",
   "why": "4x² − 81 = (2x)² − (9)² = (2x − 9)(2x + 9)."
  },
  {
   "topic": "3.5 Factorising Expressions",
   "q": "Factorise x² − 11x + 30.",
   "options": [
    "(x − 6)(x − 5)",
    "(x + 6)(x + 5)",
    "(x − 15)(x − 2)",
    "(x + 6)(x − 5)"
   ],
   "answer": 0,
   "hint": "Find two numbers that multiply to +30 and add to −11.",
   "why": "−6 × −5 = 30 and −6 + −5 = −11, so (x − 6)(x − 5)."
  },
  {
   "topic": "3.5 Factorising Expressions",
   "q": "Factorise x² + 5x − 14.",
   "options": [
    "(x + 7)(x − 2)",
    "(x − 7)(x + 2)",
    "(x + 7)(x + 2)",
    "(x + 14)(x − 1)"
   ],
   "answer": 0,
   "hint": "The constant is negative, so the signs in the brackets are different.",
   "why": "7 × −2 = −14 and 7 + (−2) = 5, so (x + 7)(x − 2)."
  },
  {
   "topic": "3.5 Factorising Expressions",
   "q": "Factorise 2x² + 13x + 15.",
   "options": [
    "(2x + 3)(x + 5)",
    "(2x + 5)(x + 3)",
    "(2x + 15)(x + 1)",
    "(x + 3)(x + 5)"
   ],
   "answer": 0,
   "hint": "Check each option by multiplying out. Which gives 13x in the middle?",
   "why": "(2x + 3)(x + 5) = 2x² + 10x + 3x + 15 = 2x² + 13x + 15. (2x + 5)(x + 3) gives 11x."
  },
  {
   "topic": "3.5 Factorising Expressions",
   "q": "Factorise ax − ay − cx + cy.",
   "options": [
    "(x − y)(a − c)",
    "(x − y)(a + c)",
    "(x + y)(a − c)",
    "(a − y)(x − c)"
   ],
   "answer": 0,
   "hint": "Group in pairs: take a out of the first two terms and −c out of the last two.",
   "why": "a(x − y) − c(x − y) = (x − y)(a − c). The two brackets must be the same."
  },
  {
   "topic": "3.6 Expressions Involving Fractions",
   "q": "Write x/2 + x/5 as a single fraction.",
   "options": [
    "7x/10",
    "2x/7",
    "x/7",
    "2x/10"
   ],
   "answer": 0,
   "hint": "The lowest common denominator of 2 and 5 is 10.",
   "why": "x/2 = 5x/10 and x/5 = 2x/10, so the total is 7x/10. Never add the denominators."
  },
  {
   "topic": "3.6 Expressions Involving Fractions",
   "q": "Write (2x − 3)/4 − (x − 5)/8 as a single fraction.",
   "options": [
    "(3x − 1)/8",
    "(3x − 11)/8",
    "(x + 2)/4",
    "(3x + 1)/8"
   ],
   "answer": 0,
   "hint": "Use 8 as the LCD. Be careful: the minus sign multiplies the whole of (x − 5).",
   "why": "[2(2x − 3) − (x − 5)]/8 = (4x − 6 − x + 5)/8 = (3x − 1)/8."
  },
  {
   "topic": "3.6 Expressions Involving Fractions",
   "q": "Express 5/x + 2/(5x − 1) as a single fraction.",
   "options": [
    "(27x − 5)/(x(5x − 1))",
    "7/(6x − 1)",
    "(25x − 3)/(x(5x − 1))",
    "(23x − 5)/(x(5x − 1))"
   ],
   "answer": 0,

function fmt(raw){
  const S1="\u0001",S2="\u0002",S3="\u0003",P1="\u0004",P2="\u0005";
  let s=String(raw).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s=s.replace(/\bm\/s\b/g,"m∕s").replace(/AND\/OR/g,"AND∕OR");
  const RUN=/[A-Za-z0-9√π.,²³⁴⁵⁶⁷⁸⁹⁰¹ˣᵗⁿ⁻∛]/;
  const OPEN={"(":")","[":"]"}, CLOSE={")":"(","]":"["};
  function fwdGroup(t,i){let d=0;for(let k=i;k<t.length;k++){if(OPEN[t[k]])d++;else if(CLOSE[t[k]]){d--;if(!d)return k;}}return -1;}
  function backGroup(t,i){let d=0;for(let k=i;k>=0;k--){if(CLOSE[t[k]])d++;else if(OPEN[t[k]]){d--;if(!d)return k;}}return -1;}
  // powers: ^(group) or ^token
  let out="";
  for(let i=0;i<s.length;i++){
    if(s[i]==="^"){
      if(s[i+1]==="("){const e=fwdGroup(s,i+1);if(e>0){out+=P1+s.slice(i+2,e)+P2;i=e;continue;}}
      let j=i+1;while(j<s.length&&/[A-Za-z0-9−]/.test(s[j]))j++;
      if(j>i+1){out+=P1+s.slice(i+1,j)+P2;i=j-1;continue;}
    }
    out+=s[i];
  }
  s=out;
  function strip(t){if(OPEN[t[0]]&&fwdGroup(t,0)===t.length-1)return t.slice(1,-1);return t;}
  // fractions
  for(let guard=0;guard<50;guard++){
    let idx=-1;
    for(let i=0;i<s.length;i++){if(s[i]==="/"){idx=i;break;}}
    if(idx<0)break;
    // numerator
    let a=idx-1;
    while(a>=0&&/[²³⁴⁵⁶⁷⁸⁹⁰¹]/.test(s[a]))a--;
    if(a>=0&&s[a]===P2){a=s.lastIndexOf(P1,a)-1;}
    if(a>=0&&CLOSE[s[a]]){a=backGroup(s,a)-1;}
    while(a>=0&&RUN.test(s[a]))a--;
    a++;
    // denominator
    let b=idx+1;
    if(s[b]==="√"&&OPEN[s[b+1]])b++;
    if(OPEN[s[b]]){const e=fwdGroup(s,b);b=e>0?e+1:b;}
    else{while(b<s.length&&RUN.test(s[b]))b++;while(b>idx+1&&/[.,]/.test(s[b-1]))b--;}
    while(b<s.length&&/[²³⁴⁵⁶⁷⁸⁹⁰¹]/.test(s[b]))b++;
    if(s[b]===P1){b=s.indexOf(P2,b)+1;}
    const num=s.slice(a,idx),den=s.slice(idx+1,b);
    if(!num||!den||a<0){s=s.slice(0,idx)+"∕"+s.slice(idx+1);continue;}
    s=s.slice(0,a)+S1+strip(num)+S2+strip(den)+S3+s.slice(b);
  }
  return s.replace(/∕/g,"/").split(S1).join('<span class="fr"><span>').split(S2).join('</span><span>').split(S3).join('</span></span>')
          .split(P1).join("<sup>").split(P2).join("</sup>");
}
const $ = id => document.getElementById(id);
const LETTERS = ["A","B","C","D","E","F"];
let round = [], i = 0, score = 0, missed = [], answered = false;

function shuffle(arr){
  for(let k = arr.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [arr[k], arr[j]] = [arr[j], arr[k]];
  }
  return arr;
}
function show(id){
  ["startScreen","quizScreen","endScreen"].forEach(s => $(s).hidden = (s !== id));
  const inQuiz = id === "quizScreen";
  $("meta").hidden = !inQuiz;
  $("barWrap").hidden = !inQuiz;
}
function prepare(q){
  const opts = q.options.map((text, idx) => ({text, correct: idx === q.answer}));
  return Object.assign({}, q, {opts: q.keepOrder ? opts : shuffle(opts)});
}
function start(){
  round = shuffle(pool()).map(prepare);
  i = 0; score = 0; missed = [];
  show("quizScreen");
  render();
}
function render(){
  answered = false;
  const q = round[i];
  $("topic").innerHTML = fmt(q.topic || "Question");
  $("question").innerHTML = fmt(q.q);
  $("count").textContent = "Question " + (i + 1) + " of " + round.length;
  $("tally").textContent = "Score: " + score;
  $("bar").style.width = (i / round.length * 100) + "%";
  $("hint").innerHTML = fmt(q.hint || "");
  $("hint").hidden = true;
  $("hintBtn").hidden = !q.hint;
  const fb = $("feedback"); fb.className = "feedback"; fb.textContent = "";
  $("nextBtn").hidden = true;
  const box = $("options"); box.textContent = "";
  q.opts.forEach((o, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    const l = document.createElement("span"); l.className = "letter"; l.textContent = LETTERS[idx];
    const t = document.createElement("span"); t.innerHTML = fmt(o.text);
    b.appendChild(l); b.appendChild(t);
    b.addEventListener("click", () => choose(idx));
    box.appendChild(b);
  });
  window.scrollTo({top:0});
}
function choose(idx){
  if(answered) return;
  answered = true;
  const q = round[i];
  const buttons = Array.from($("options").children);
  const correct = q.opts[idx].correct;
  const rightText = q.opts.find(o => o.correct).text;
  buttons.forEach((b, k) => {
    b.disabled = true;
    if(q.opts[k].correct) b.classList.add("right");
    else if(k === idx) b.classList.add("wrong");
  });
  const fb = $("feedback");
  const head = document.createElement("b");
  const body = document.createElement("span");
  if(correct){ score++; fb.className = "feedback good"; head.textContent = "Correct!"; }
  else { missed.push({q: q.q, a: rightText, why: q.why}); fb.className = "feedback bad"; head.innerHTML = "Not quite. The answer is: " + fmt(rightText); }
  body.innerHTML = fmt(q.why || "");
  fb.appendChild(head); fb.appendChild(body);
  $("tally").textContent = "Score: " + score;
  $("bar").style.width = ((i + 1) / round.length * 100) + "%";
  $("hintBtn").hidden = true;
  const next = $("nextBtn");
  next.textContent = (i === round.length - 1) ? "See my score" : "Next question";
  next.hidden = false;
  next.focus();
}
function finish(){
  show("endScreen");
  const name = $("nameInput").value.trim();
  const d = new Date();
  const day = d.toLocaleDateString("en-IE", {day:"numeric", month:"long", year:"numeric"});
  const secs = chosen();
  $("who").textContent = (name ? name + " · " : "") + day + " · " + (secs.length === SECTIONS.length ? "All sections" : secs.join(", "));
  $("finalScore").textContent = score + " / " + round.length;
  const pct = score / round.length;
  $("finalMsg").textContent =
    pct === 1 ? "Perfect score. Take a bow." :
    pct >= 0.75 ? "Great work. You know this well." :
    pct >= 0.5 ? "Good effort. Check the ones below, then try again." :
    "Keep going. Read over the pages again, then try again.";
  const list = $("missedList"); list.textContent = "";
  missed.forEach(m => {
    const li = document.createElement("li");
    const s = document.createElement("strong"); s.innerHTML = fmt(m.q);
    const a = document.createElement("span"); a.innerHTML = fmt("Answer: " + m.a + (m.why ? ". " + m.why : ""));
    li.appendChild(s); li.appendChild(a); list.appendChild(li);
  });
  $("missedWrap").hidden = missed.length === 0;
  $("againBtn").focus();
}

$("title").textContent = QUIZ.title;
document.title = QUIZ.title;
$("subtitle").textContent = QUIZ.subtitle || "";
$("subtitle").hidden = !QUIZ.subtitle;
$("introText").textContent = QUIZ.intro;
const SECTIONS = [];
QUIZ.questions.forEach(q => { if(!SECTIONS.includes(q.topic)) SECTIONS.push(q.topic); });
const list = $("sectionList");
SECTIONS.forEach((s, k) => {
  const lab = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox"; box.checked = true; box.value = s; box.id = "sec" + k;
  box.addEventListener("change", updateCount);
  const txt = document.createElement("span"); txt.textContent = s;
  const n = QUIZ.questions.filter(q => q.topic === s).length;
  const sm = document.createElement("small"); sm.textContent = n + (n === 1 ? " question" : " questions");
  lab.appendChild(box); lab.appendChild(txt); lab.appendChild(sm);
  list.appendChild(lab);
});
function chosen(){ return Array.from(list.querySelectorAll("input:checked")).map(b => b.value); }
function pool(){ const c = chosen(); return QUIZ.questions.filter(q => c.includes(q.topic)); }
function updateCount(){
  const n = pool().length;
  $("pickCount").textContent = n ? n + " questions selected" : "No sections selected";
  if(n) $("pickError").hidden = true;
}
$("allBtn").addEventListener("click", () => { list.querySelectorAll("input").forEach(b => b.checked = true); updateCount(); });
$("noneBtn").addEventListener("click", () => { list.querySelectorAll("input").forEach(b => b.checked = false); updateCount(); });
updateCount();
function tryStart(){
  if(!pool().length){ $("pickError").hidden = false; return; }
  start();
}
$("startBtn").addEventListener("click", tryStart);
$("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") tryStart(); });
$("againBtn").addEventListener("click", start);
$("changeBtn").addEventListener("click", () => { show("startScreen"); window.scrollTo({top:0}); });
$("nextBtn").addEventListener("click", () => { i++; if(i < round.length) render(); else finish(); });
$("hintBtn").addEventListener("click", () => { $("hint").hidden = false; $("hintBtn").hidden = true; });
</script>
</body>
