<style>
:root{
  --bg:#ffffff; --ink:#1f1b0f; --muted:#5a5547; --band:#ffd84d; --bandInk:#1f1b0f;
  --card:#fffbea; --line:#e6dfc4;
  --opt:#ffffff; --optLine:#cfc6a3; --optHover:#fff3c4; --letter:#2f6fdb; --letterInk:#ffffff;
  --good:#1d7a3e; --goodSoft:#e3f4e8; --bad:#b3261e; --badSoft:#fde7e5;
  --focus:#1f55b8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --ink:#f3efe2; --muted:#c4bda6; --band:#e8c02f;
    --card:#222017; --line:#3a3726; --opt:#2a2719; --optLine:#4a4630; --optHover:#36321f;
    --letter:#5b8ff0; --good:#7fd89b; --goodSoft:#17331f; --bad:#ff9a90; --badSoft:#3d1a18;
    --focus:#9dbdff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --ink:#f3efe2; --muted:#c4bda6; --band:#e8c02f;
  --card:#222017; --line:#3a3726; --opt:#2a2719; --optLine:#4a4630; --optHover:#36321f;
  --letter:#5b8ff0; --good:#7fd89b; --goodSoft:#17331f; --bad:#ff9a90; --badSoft:#3d1a18;
  --focus:#9dbdff; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend','Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.5}
header{background:var(--band);color:var(--bandInk);padding:20px 20px 18px}
.wrap{max-width:760px;margin:0 auto}
.back{display:inline-block;margin-bottom:10px;color:var(--bandInk);font-size:16px;font-weight:500;text-decoration:none}
.back:hover{text-decoration:underline}
.backBtn{display:inline-block;margin:20px 0 0 12px;color:var(--ink);font-size:18px;font-weight:500}
.nameError{margin:8px 0 0;color:var(--bad);font-weight:500}
header h1{margin:0;font-size:clamp(24px,5vw,34px);font-weight:700;letter-spacing:-0.3px;line-height:1.2}
.sub{margin:4px 0 0;font-size:16px;font-weight:500}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:500;font-size:16px}
.bar{height:12px;background:rgba(31,27,15,.18);border-radius:999px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;width:0;background:var(--bandInk);border-radius:999px;transition:width .3s ease}
main{padding:24px 20px 48px}
[hidden]{display:none!important}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:28px 24px}
.ask{margin:0;color:var(--muted);font-weight:500;font-size:16px}
.question{margin:8px 0 0;font-size:clamp(22px,4.6vw,28px);font-weight:700;line-height:1.3}
.hintBtn{margin-top:16px;background:none;border:2px solid var(--optLine);color:var(--ink);font:inherit;font-size:16px;font-weight:500;border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
.hint{margin:12px 0 0;font-size:17px;color:var(--muted)}
.options{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;text-align:left;background:var(--opt);color:var(--ink);border:2px solid var(--optLine);border-radius:16px;font:inherit;font-size:19px;font-weight:500;cursor:pointer}
.choice:hover:not(:disabled){background:var(--optHover)}
.choice .letter{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--letter);color:var(--letterInk);font-weight:700;font-size:17px}
.choice:disabled{cursor:default;opacity:.5}
.choice.right{opacity:1;border:3px solid var(--good);background:var(--goodSoft)}
.choice.right .letter{background:var(--good);color:var(--bg)}
.choice.wrong{opacity:1;border:3px solid var(--bad);background:var(--badSoft)}
.choice.wrong .letter{background:var(--bad);color:var(--bg)}
.feedback{margin-top:18px;border-radius:16px;padding:16px 20px;font-size:18px}
.feedback:empty{display:none}
.feedback.good{background:var(--goodSoft);border:2px solid var(--good)}
.feedback.bad{background:var(--badSoft);border:2px solid var(--bad)}
.feedback b{display:block;font-size:20px;margin-bottom:4px}
.primary{display:inline-block;margin-top:20px;background:var(--ink);color:var(--bg);border:none;border-radius:16px;font:inherit;font-size:20px;font-weight:700;padding:14px 28px;min-height:56px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.intro p{margin:0 0 12px}
label{display:block;font-weight:500;margin:16px 0 6px}
input[type=text]{width:100%;max-width:360px;font:inherit;padding:10px 14px;border:2px solid var(--optLine);border-radius:12px;background:var(--opt);color:var(--ink);min-height:48px}
.who{margin:0;font-size:18px;font-weight:500}
.score{font-size:clamp(48px,12vw,80px);font-weight:700;line-height:1;margin:8px 0}
.missed{list-style:none;padding:0;margin:16px 0 0}
.missed li{border-top:2px solid var(--line);padding:12px 0}
.missed li span{display:block;font-size:16px;color:var(--muted)}
@media (max-width:520px){.panel{padding:22px 18px}.choice{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.pick{border:2px solid var(--line);border-radius:16px;padding:12px 16px 14px;margin:8px 0 0;background:var(--opt)}
.pick legend{font-weight:700;padding:0 6px}
.pickBtns{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.pickBtns button{background:none;border:2px solid var(--optLine);color:var(--ink);font:inherit;font-size:15px;font-weight:500;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.pick label{display:flex;align-items:center;gap:12px;margin:0;padding:8px 4px;font-weight:500;font-size:17px;cursor:pointer;border-top:1px solid var(--line)}
.pick label:first-of-type{border-top:none}
.pick input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--letter)}
.pick small{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.pickCount{margin:10px 0 0;font-weight:500}
.optional{font-weight:400;color:var(--muted)}
.ghost{display:inline-block;margin:20px 0 0 12px;background:none;border:2px solid var(--optLine);color:var(--ink);border-radius:16px;font:inherit;font-size:18px;font-weight:500;padding:12px 20px;min-height:52px;cursor:pointer}
.home{float:right}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr>span{display:block;padding:0 .15em}.fr>span:first-child{border-bottom:2px solid currentColor}
sup{font-size:.68em;line-height:0}sup:has(.fr){vertical-align:.75em}sup .fr{vertical-align:middle;font-size:.95em}sup .fr>span:first-child{border-bottom-width:1.5px}

/* design v2 quiz */
header{position:relative;overflow:hidden;background-color:#b9531a;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px;color:#fff}

s:none}
header .wrap{position:relative;z-index:1}
header .back{color:#fff}
.bar{background:rgba(255,255,255,.3)}.bar span{background:#fff}
.top::after,header::after{-webkit-mask:linear-gradient(90deg,transparent 35%,#000 75%);mask:linear-gradient(90deg,transparent 35%,#000 75%)}
@media (max-width:640px){.top::after,header::after{opacity:.07}}
</style>

<header>
  <div class="wrap">

    <h1 id="title"></h1>

<main class="wrap">

<script>
const QUIZ = {
 "title": "Chapter 5 Practice: Algebra II",
 "subtitle": "Active Maths 3, Chapter 5, pages 76 to 103",
 "intro": "54 questions based on the exercises in Chapter 5, across 12 sections. Do them all, or pick the sections you’re working on.",
 "questions": [
  {
   "topic": "5.1 Solving Linear Equations",
   "q": "Solve 3x + 7 = 34.",
   "options": [
    "x = 9",
    "x = 27",
    "x = 41/3",
    "x = 7"
   ],
   "answer": 0,
   "hint": "Subtract 7 from both sides first.",
   "why": "3x = 27, so x = 9."
  },
  {
   "topic": "5.1 Solving Linear Equations",
   "q": "Solve 4x + 3 = 2x + 11.",
   "options": [
    "x = 4",
    "x = 7",
    "x = 2",
    "x = 8"
   ],
   "answer": 0,
   "hint": "Get the x terms on one side and the numbers on the other.",
   "why": "4x − 2x = 11 − 3, so 2x = 8 and x = 4."
  },
  {
   "topic": "5.1 Solving Linear Equations",
   "q": "Solve 2(x − 1) = 4x.",
   "options": [
    "x = −1",
    "x = 1",
    "x = −2",
    "x = −1/3"
   ],
   "answer": 0,
   "hint": "Multiply out the bracket first.",
   "why": "2x − 2 = 4x, so −2 = 2x and x = −1."
  },
  {
   "topic": "5.1 Solving Linear Equations",
   "q": "Solve 3(x − 6) + 15 = 4(x − 1) + 4.",
   "options": [
    "x = −3",
    "x = 3",
    "x = 5",
    "x = −1"
   ],
   "answer": 0,
   "hint": "Simplify each side fully before moving terms across.",
   "why": "3x − 18 + 15 = 4x − 4 + 4 gives 3x − 3 = 4x, so x = −3."
  },
  {
   "topic": "5.2 Problems Involving Linear Equations",
   "q": "Ben is x years old. Amy is 2 years older than Ben. Carl is 5 years younger than Amy. Their ages add to 113. How old is Ben?",
   "options": [
    "38",
    "40",
    "35",
    "37"
   ],
   "answer": 0,
   "hint": "Carl’s age is (x + 2) − 5. Add all three ages and set the total equal to 113.",
   "why": "x + (x + 2) + (x − 3) = 113, so 3x − 1 = 113 and x = 38. Amy is 40 and Carl is 35."
  },
  {
   "topic": "5.2 Problems Involving Linear Equations",
   "q": "A number is doubled and then 17 is added. The result is 35. What is the number?",
   "options": [
    "9",
    "26",
    "18",
    "8.5"
   ],
   "answer": 0,
   "hint": "Write it as an equation: 2x + 17 = 35.",
   "why": "2x = 35 − 17 = 18, so x = 9."
  },
  {
   "topic": "5.2 Problems Involving Linear Equations",
   "q": "A cinema has 100 seats. Luxury seats cost €10 and standard seats cost €5. When full, the takings are €650. How many seats are luxury?",
   "options": [
    "30",
    "70",
    "65",
    "35"
   ],
   "answer": 0,
   "hint": "Let x be the number of standard seats. Then there are (100 − x) luxury seats.",
   "why": "5x + 10(100 − x) = 650 gives 1,000 − 5x = 650, so x = 70 standard seats and 30 luxury seats."
  },
  {
   "topic": "5.2 Problems Involving Linear Equations",
   "q": "The angles of a triangle are 60°, 3x° and 5x°. Find x.",
   "options": [
    "15",
    "22.5",
    "30",
    "20"
   ],
   "answer": 0,
   "hint": "The angles in a triangle add to 180°.",
   "why": "60 + 3x + 5x = 180, so 8x = 120 and x = 15."
  },
  {
   "topic": "5.2 Problems Involving Linear Equations",
   "q": "The sum of a natural number n and the next natural number is 83. What are the two numbers?",
   "options": [
    "41 and 42",
    "42 and 43",
    "40 and 41",
    "83 and 84"
   ],
   "answer": 0,
   "hint": "The next natural number is n + 1. So n + (n + 1) = 83.",
   "why": "2n + 1 = 83, so n = 41. The numbers are 41 and 42."
  },
  {
   "topic": "5.3 Linear Equations Involving Fractions",
   "q": "Solve (x + 3)/5 = 1.",
   "options": [
    "x = 2",
    "x = 8",
    "x = −2",
    "x = 1.6"
   ],
   "answer": 0,
   "hint": "Multiply both sides by 5.",
   "why": "x + 3 = 5, so x = 2."
  },
  {
   "topic": "5.3 Linear Equations Involving Fractions",
   "q": "Solve (x + 1)/3 = x/2.",
   "options": [
    "x = 2",
    "x = 1",
    "x = −2",
    "x = 6"
   ],
   "answer": 0,
   "hint": "Multiply both sides by the LCD, 6.",
   "why": "2(x + 1) = 3x, so 2x + 2 = 3x and x = 2."
  },
  {
   "topic": "5.3 Linear Equations Involving Fractions",
   "q": "Solve x/6 − x/2 = 5.",
   "options": [
    "x = −15",
    "x = 15",
    "x = −7.5",
    "x = 30"
   ],
   "answer": 0,
   "hint": "Multiply every term, including the 5, by 6.",
   "why": "x − 3x = 30, so −2x = 30 and x = −15."
  },
  {
   "topic": "5.3 Linear Equations Involving Fractions",
   "q": "Solve (8x − 3)/3 − (4x − 2)/5 = 5.",
   "options": [
    "x = 3",
    "x = 2",
    "x = 4",
    "x = 24/7"
   ],
   "answer": 0,
   "hint": "Multiply by 15. Be careful: −3(4x − 2) gives +6 at the end.",
   "why": "5(8x − 3) − 3(4x − 2) = 75 gives 40x − 15 − 12x + 6 = 75, so 28x = 84 and x = 3."
  },
  {
   "topic": "5.4 Linear Inequalities",
   "q": "Write down the first three values of x > 2, x ∈ ℕ.",
   "options": [
    "3, 4, 5",
    "2, 3, 4",
    "1, 2, 3",
    "0, 1, 2"
   ],
   "answer": 0,
   "hint": "Is 2 itself included when the sign is >?",
   "why": "> means strictly greater than, so 2 is not included. The first three natural numbers above 2 are 3, 4, 5."
  },
  {
   "topic": "5.4 Linear Inequalities",
   "q": "Which inequality describes ‘a real number whose value is at least 5’?",
   "options": [
    "x ≥ 5, x ∈ ℝ",
    "x > 5, x ∈ ℝ",
    "x ≤ 5, x ∈ ℝ",
    "x < 5, x ∈ ℝ"
   ],
   "answer": 0,
   "hint": "‘At least 5’ means 5 or more. Is 5 allowed?",
   "why": "At least 5 includes 5 itself, so we use ≥."
  },
  {
   "topic": "5.4 Linear Inequalities",
   "q": "Solve 5 + 2(3 − x) < 13.",
   "options": [
    "x > −1",
    "x < −1",
    "x > 1",
    "x < 1"
   ],
   "answer": 0,
   "hint": "After simplifying you get −2x < 2. What happens when you divide by a negative?",
   "why": "11 − 2x < 13, so −2x < 2. Dividing by −2 flips the sign: x > −1."
  },
  {
   "topic": "5.4 Linear Inequalities",
   "q": "Solve 2 − 4x ≤ 18.",
   "options": [
    "x ≥ −4",
    "x ≤ −4",
    "x ≥ 4",
    "x ≤ 4"
   ],
   "answer": 0,
   "hint": "−4x ≤ 16. Remember the rule for dividing by a negative number.",
   "why": "−4x ≤ 16. Divide by −4 and reverse the sign: x ≥ −4."
  },
  {
   "topic": "5.4 Linear Inequalities",
   "q": "How is x > −1, x ∈ ℝ shown on a number line?",
   "options": [
    "An open circle at −1 with solid shading to the right",
    "A filled circle at −1 with solid shading to the right",
    "An open circle at −1 with shading to the left",
    "Dots at 0, 1, 2 with an arrow"
   ],
   "answer": 0,
   "hint": "Real numbers use continuous shading. Is −1 itself included?",
   "why": "ℝ needs solid shading, and −1 is not included, so it gets an open circle. Dots are for ℕ and ℤ."
  },
  {
   "topic": "5.4 Linear Inequalities",
   "q": "Find the smallest value of x ∈ ℕ for which 2(x − 1) − 33 > 0.",
   "options": [
    "18",
    "17",
    "35",
    "19"
   ],
   "answer": 0,
   "hint": "Solve the inequality first, then pick the smallest natural number that works.",
   "why": "2x − 2 − 33 > 0 gives 2x > 35, so x > 17.5. The smallest natural number is 18."
  },
  {
   "topic": "5.5 Simultaneous Linear Equations",
   "q": "Solve x + y = 7 and x − y = 1.",
   "options": [
    "x = 4, y = 3",
    "x = 3, y = 4",
    "x = 5, y = 2",
    "x = 6, y = 1"
   ],
   "answer": 0,
   "hint": "Add the two equations to get rid of y.",
   "why": "2x = 8, so x = 4. Then 4 + y = 7 gives y = 3. Check: 4 − 3 = 1."
  },
  {
   "topic": "5.5 Simultaneous Linear Equations",
   "q": "Solve 2x + y = 9 and 3x + y = 11.",
   "options": [
    "x = 2, y = 5",
    "x = 4, y = 1",
    "x = 5, y = −1",
    "x = 3, y = 3"
   ],
   "answer": 0,
   "hint": "Subtract the first equation from the second.",

function fmt(raw){
  const S1="\u0001",S2="\u0002",S3="\u0003",P1="\u0004",P2="\u0005";
  let s=String(raw).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s=s.replace(/\bm\/s\b/g,"m∕s").replace(/AND\/OR/g,"AND∕OR");
  const RUN=/[A-Za-z0-9√π.,²³⁴⁵⁶⁷⁸⁹⁰¹ˣᵗⁿ⁻∛]/;
  const OPEN={"(":")","[":"]"}, CLOSE={")":"(","]":"["};
  function fwdGroup(t,i){let d=0;for(let k=i;k<t.length;k++){if(OPEN[t[k]])d++;else if(CLOSE[t[k]]){d--;if(!d)return k;}}return -1;}
  function backGroup(t,i){let d=0;for(let k=i;k>=0;k--){if(CLOSE[t[k]])d++;else if(OPEN[t[k]]){d--;if(!d)return k;}}return -1;}
  // powers: ^(group) or ^token
  let out="";
  for(let i=0;i<s.length;i++){
    if(s[i]==="^"){
      if(s[i+1]==="("){const e=fwdGroup(s,i+1);if(e>0){out+=P1+s.slice(i+2,e)+P2;i=e;continue;}}
      let j=i+1;while(j<s.length&&/[A-Za-z0-9−]/.test(s[j]))j++;
      if(j>i+1){out+=P1+s.slice(i+1,j)+P2;i=j-1;continue;}
    }
    out+=s[i];
  }
  s=out;
  function strip(t){if(OPEN[t[0]]&&fwdGroup(t,0)===t.length-1)return t.slice(1,-1);return t;}
  // fractions
  for(let guard=0;guard<50;guard++){
    let idx=-1;
    for(let i=0;i<s.length;i++){if(s[i]==="/"){idx=i;break;}}
    if(idx<0)break;
    // numerator
    let a=idx-1;
    while(a>=0&&/[²³⁴⁵⁶⁷⁸⁹⁰¹]/.test(s[a]))a--;
    if(a>=0&&s[a]===P2){a=s.lastIndexOf(P1,a)-1;}
    if(a>=0&&CLOSE[s[a]]){a=backGroup(s,a)-1;}
    while(a>=0&&RUN.test(s[a]))a--;
    a++;
    // denominator
    let b=idx+1;
    if(s[b]==="√"&&OPEN[s[b+1]])b++;
    if(OPEN[s[b]]){const e=fwdGroup(s,b);b=e>0?e+1:b;}
    else{while(b<s.length&&RUN.test(s[b]))b++;while(b>idx+1&&/[.,]/.test(s[b-1]))b--;}
    while(b<s.length&&/[²³⁴⁵⁶⁷⁸⁹⁰¹]/.test(s[b]))b++;
    if(s[b]===P1){b=s.indexOf(P2,b)+1;}
    const num=s.slice(a,idx),den=s.slice(idx+1,b);
    if(!num||!den||a<0){s=s.slice(0,idx)+"∕"+s.slice(idx+1);continue;}
    s=s.slice(0,a)+S1+strip(num)+S2+strip(den)+S3+s.slice(b);
  }
  return s.replace(/∕/g,"/").split(S1).join('<span class="fr"><span>').split(S2).join('</span><span>').split(S3).join('</span></span>')
          .split(P1).join("<sup>").split(P2).join("</sup>");
}
const $ = id => document.getElementById(id);
const LETTERS = ["A","B","C","D","E","F"];
let round = [], i = 0, score = 0, missed = [], answered = false;

function shuffle(arr){
  for(let k = arr.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [arr[k], arr[j]] = [arr[j], arr[k]];
  }
  return arr;
}
function show(id){
  ["startScreen","quizScreen","endScreen"].forEach(s => $(s).hidden = (s !== id));
  const inQuiz = id === "quizScreen";
  $("meta").hidden = !inQuiz;
  $("barWrap").hidden = !inQuiz;
}
function prepare(q){
  const opts = q.options.map((text, idx) => ({text, correct: idx === q.answer}));
  return Object.assign({}, q, {opts: q.keepOrder ? opts : shuffle(opts)});
}
function start(){
  round = shuffle(pool()).map(prepare);
  i = 0; score = 0; missed = [];
  show("quizScreen");
  render();
}
function render(){
  answered = false;
  const q = round[i];
  $("topic").innerHTML = fmt(q.topic || "Question");
  $("question").innerHTML = fmt(q.q);
  $("count").textContent = "Question " + (i + 1) + " of " + round.length;
  $("tally").textContent = "Score: " + score;
  $("bar").style.width = (i / round.length * 100) + "%";
  $("hint").innerHTML = fmt(q.hint || "");
  $("hint").hidden = true;
  $("hintBtn").hidden = !q.hint;
  const fb = $("feedback"); fb.className = "feedback"; fb.textContent = "";
  $("nextBtn").hidden = true;
  const box = $("options"); box.textContent = "";
  q.opts.forEach((o, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    const l = document.createElement("span"); l.className = "letter"; l.textContent = LETTERS[idx];
    const t = document.createElement("span"); t.innerHTML = fmt(o.text);
    b.appendChild(l); b.appendChild(t);
    b.addEventListener("click", () => choose(idx));
    box.appendChild(b);
  });
  window.scrollTo({top:0});
}
function choose(idx){
  if(answered) return;
  answered = true;
  const q = round[i];
  const buttons = Array.from($("options").children);
  const correct = q.opts[idx].correct;
  const rightText = q.opts.find(o => o.correct).text;
  buttons.forEach((b, k) => {
    b.disabled = true;
    if(q.opts[k].correct) b.classList.add("right");
    else if(k === idx) b.classList.add("wrong");
  });
  const fb = $("feedback");
  const head = document.createElement("b");
  const body = document.createElement("span");
  if(correct){ score++; fb.className = "feedback good"; head.textContent = "Correct!"; }
  else { missed.push({q: q.q, a: rightText, why: q.why}); fb.className = "feedback bad"; head.innerHTML = "Not quite. The answer is: " + fmt(rightText); }
  body.innerHTML = fmt(q.why || "");
  fb.appendChild(head); fb.appendChild(body);
  $("tally").textContent = "Score: " + score;
  $("bar").style.width = ((i + 1) / round.length * 100) + "%";
  $("hintBtn").hidden = true;
  const next = $("nextBtn");
  next.textContent = (i === round.length - 1) ? "See my score" : "Next question";
  next.hidden = false;
  next.focus();
}
function finish(){
  show("endScreen");
  const name = $("nameInput").value.trim();
  const d = new Date();
  const day = d.toLocaleDateString("en-IE", {day:"numeric", month:"long", year:"numeric"});
  const secs = chosen();
  $("who").textContent = (name ? name + " · " : "") + day + " · " + (secs.length === SECTIONS.length ? "All sections" : secs.join(", "));
  $("finalScore").textContent = score + " / " + round.length;
  const pct = score / round.length;
  $("finalMsg").textContent =
    pct === 1 ? "Perfect score. Take a bow." :
    pct >= 0.75 ? "Great work. You know this well." :
    pct >= 0.5 ? "Good effort. Check the ones below, then try again." :
    "Keep going. Read over the pages again, then try again.";
  const list = $("missedList"); list.textContent = "";
  missed.forEach(m => {
    const li = document.createElement("li");
    const s = document.createElement("strong"); s.innerHTML = fmt(m.q);
    const a = document.createElement("span"); a.innerHTML = fmt("Answer: " + m.a + (m.why ? ". " + m.why : ""));
    li.appendChild(s); li.appendChild(a); list.appendChild(li);
  });
  $("missedWrap").hidden = missed.length === 0;
  $("againBtn").focus();
}

$("title").textContent = QUIZ.title;
document.title = QUIZ.title;
$("subtitle").textContent = QUIZ.subtitle || "";
$("subtitle").hidden = !QUIZ.subtitle;
$("introText").textContent = QUIZ.intro;
const SECTIONS = [];
QUIZ.questions.forEach(q => { if(!SECTIONS.includes(q.topic)) SECTIONS.push(q.topic); });
const list = $("sectionList");
SECTIONS.forEach((s, k) => {
  const lab = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox"; box.checked = true; box.value = s; box.id = "sec" + k;
  box.addEventListener("change", updateCount);
  const txt = document.createElement("span"); txt.textContent = s;
  const n = QUIZ.questions.filter(q => q.topic === s).length;
  const sm = document.createElement("small"); sm.textContent = n + (n === 1 ? " question" : " questions");
  lab.appendChild(box); lab.appendChild(txt); lab.appendChild(sm);
  list.appendChild(lab);
});
function chosen(){ return Array.from(list.querySelectorAll("input:checked")).map(b => b.value); }
function pool(){ const c = chosen(); return QUIZ.questions.filter(q => c.includes(q.topic)); }
function updateCount(){
  const n = pool().length;
  $("pickCount").textContent = n ? n + " questions selected" : "No sections selected";
  if(n) $("pickError").hidden = true;
}
$("allBtn").addEventListener("click", () => { list.querySelectorAll("input").forEach(b => b.checked = true); updateCount(); });
$("noneBtn").addEventListener("click", () => { list.querySelectorAll("input").forEach(b => b.checked = false); updateCount(); });
updateCount();
function tryStart(){
  if(!pool().length){ $("pickError").hidden = false; return; }
  start();
}
$("startBtn").addEventListener("click", tryStart);
$("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") tryStart(); });
$("againBtn").addEventListener("click", start);
$("changeBtn").addEventListener("click", () => { show("startScreen"); window.scrollTo({top:0}); });
$("nextBtn").addEventListener("click", () => { i++; if(i < round.length) render(); else finish(); });
$("hintBtn").addEventListener("click", () => { $("hint").hidden = false; $("hintBtn").hidden = true; });
</script>
</body>
</html>
